services:
  # Tier 3: Database (PostgreSQL)
  postgres_db:
    image: postgres:16-alpine
    container_name: form_postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123}
      POSTGRES_DB: ${DB_NAME:-form_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-form_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Tier 2: Backend REST API (Node.js/Express)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: form_backend_api
    restart: unless-stopped
    environment:
      PORT: 5000
      DB_HOST: postgres_db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres123}
      DB_NAME: ${DB_NAME:-form_db}
      NODE_ENV: production
    ports:
      - "5000:5000"
    depends_on:
      postgres_db:
        condition: service_healthy
    networks:
      app_network:
        aliases:
          - backend-service

  # Tier 1: Frontend Web UI (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: form_frontend_ui
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - app_network

volumes:
  postgres_data:
    driver: local

networks:
  app_network:
    driver: bridge
