apiVersion: v1
kind: Secret
metadata:
  name: aurora-rds-secret
  namespace: three-tier-app
type: Opaque
stringData:
  # Replace with your actual AWS Aurora RDS Cluster Endpoint
  DB_HOST: "your-aurora-cluster-endpoint.cluster-xxxxxx.us-east-1.rds.amazonaws.com"
  DB_PORT: "5432"
  DB_USER: "postgres"
  DB_PASSWORD: "YourAuroraSecurePassword123!"
  DB_NAME: "form_db"
  DB_SSL: "true"
